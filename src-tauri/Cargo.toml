[package]
name = "headphone-dsp"
version = "0.1.0"
description = "Headphone DSP: crossfeed, parametric EQ and CamillaDSP pipeline control"
authors = ["Alfred Widell"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "headphone_dsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "headphone-dsp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
realfft = "3"
num-complex = "0.4"
include_dir = "0.7"
tokio = { version = "1", features = ["net", "process", "sync", "time", "rt-multi-thread", "macros", "io-util", "fs"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
cpal = "0.15"
dirs = "6"
